groups:
  - name: roster-sync
    rules:
      - alert: OutboxLagHigh
        expr: roster_outbox_lag_seconds > 60
        for: 5m
        annotations:
          summary: "Employee change events are over a minute behind; downstream (bookings) is stale"

      - alert: OutboxDeadLetters
        expr: roster_outbox_dead_lettered > 0
        annotations:
          summary: "Events gave up after max retries; inspect outbox.last_error and replay"

      - alert: IngestFailureRateHigh
        expr: >
          sum(rate(roster_ingest_records_total{outcome="FAILED"}[5m]))
            / sum(rate(roster_ingest_records_total[5m])) > 0.01
        for: 10m
        annotations:
          summary: "More than 1% of valid HR records fail to apply (database or bug, not bad data)"

      - alert: IngestRejectionSpike
        expr: >
          sum by (tenant) (rate(roster_ingest_records_total{outcome="REJECTED"}[15m]))
            / sum by (tenant) (rate(roster_ingest_records_total[15m])) > 0.2
        for: 15m
        annotations:
          summary: "A client's HR feed is sending mostly invalid records; contact the client"

      - alert: ReconciliationBrakeTriggered
        expr: increase(roster_reconciliation_brake_triggered_total[1h]) > 0
        annotations:
          summary: "Nightly export looked broken and was held; an operator must review and approve"