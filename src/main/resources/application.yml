spring:
  application:
    name: roster-sync
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rostersync}
    username: ${DB_USER:rostersync}
    password: ${DB_PASSWORD:rostersync}
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always