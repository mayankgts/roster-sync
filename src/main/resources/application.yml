spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  application:
    name: roster-sync
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rostersync}
    username: ${DB_USER:rostersync}
    password: ${DB_PASSWORD:rostersync}
    hikari:
      maximum-pool-size: 10
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

roster:
  reconciliation:
    brake-threshold: 0.30
    storage-dir: ${java.io.tmpdir}/roster-reconciliation
  outbox:
    relay:
      enabled: true
    poll-interval-ms: 1000
    batch-size: 100
    max-attempts: 5

